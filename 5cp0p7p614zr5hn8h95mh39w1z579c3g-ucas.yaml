apiVersion: berg.norelect.ch/v1
kind: Challenge
metadata:
  namespace: berg
  name: ucas
spec:
  author: sportshead
  flag: gaslightCTF{m4n1f3st1ng_e4sy_0ff3r5_f0r_ev3ry0n3}
  flagFormat: gaslightCTF{...}
  description: 'these uni apps are getting harder and harder every year!

    '
  difficulty: easy
  categories:
    - pwn
  containers:
    - hostname: chall
      image: ghcr.io/gaslightctf/challs-2026/ucas:dev
      ports:
        - port: 1337
          protocol: tcp
          appProtocol: tcp
          type: publicTlsRoute
      dynamicFlag:
        content:
          path: /flag
  attachments:
    - fileName: ucas.tar.zst
      downloadUrl: https://pantry-dev.gaslightctf.cooking/5cp0p7p614zr5hn8h95mh39w1z579c3g-ucas/ucas.tar.zst
