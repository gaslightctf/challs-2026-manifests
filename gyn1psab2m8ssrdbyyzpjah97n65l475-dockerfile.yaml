apiVersion: berg.norelect.ch/v1
kind: Challenge
metadata:
  namespace: berg
  name: dockerfile
spec:
  author: sportshead
  flag: gaslightCTF{dockerfile_test_flag}
  flagFormat: gaslightCTF{...}
  description: 'Infra test challenge. Connect to get the flag!

    '
  difficulty: easy
  categories:
    - misc
  containers:
    - hostname: chall
      image: ghcr.io/gaslightctf/challs-2026/dockerfile:dev
      ports:
        - port: 1337
          protocol: tcp
          appProtocol: tcp
          type: publicTlsRoute
      dynamicFlag:
        env:
          name: FLAG
  attachments:
    - fileName: dockerfile.tar.zst
      downloadUrl: https://pantry-dev.gaslightctf.cooking/gyn1psab2m8ssrdbyyzpjah97n65l475-dockerfile/dockerfile.tar.zst
