apiVersion: berg.norelect.ch/v1
kind: Challenge
metadata:
  namespace: berg
  name: dockerfile
spec:
  author: sportshead
  flag: gaslightCTF{dockerfile_test_flag}
  flagFormat: gaslightCTF{...}
  description: 'Infra test challenge. Connect to get the flag.

    '
  difficulty: easy
  categories:
    - misc
  tags:
    - infra
    - test
  containers:
    - hostname: chall
      image: ghcr.io/gaslightctf/challs-2026/dockerfile:dev
      ports:
        - port: 1337
          protocol: tcp
          appProtocol: tcp
          type: publicTlsRoute
      dynamicFlag:
        env:
          name: FLAG
  attachments: []
